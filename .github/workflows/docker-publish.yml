name: Build and Publish Docker Images

on:
  push:
    branches: [ "main", "develop" ]
    # Publish semver tags as releases
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  # Use GitHub Container Registry
  REGISTRY: ghcr.io
  # Repository owner/name
  IMAGE_NAME: ${{ github.repository }}
  # Search service image repo (owner/name)
  SEARCH_SERVICE_IMAGE_NAME: alabarazi/turath-search-service

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For sigstore/fulcio identity challenge
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.6.1
  
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    # -----------------------------------------------------------
    # Build Main Application Image (InvenioRDM + Turath customizations)
    # -----------------------------------------------------------
      - name: Extract metadata for main app
        id: meta-app
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push main application image
        uses: docker/build-push-action@v6.7.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    # -----------------------------------------------------------
    # Build Frontend Image (Nginx reverse proxy)
    # -----------------------------------------------------------
      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push frontend image
        uses: docker/build-push-action@v6.7.0
        with:
          context: ./docker/nginx
          file: ./docker/nginx/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    # -----------------------------------------------------------
    # Build Search Service Image (IIIF search/annotations)
    # -----------------------------------------------------------
      - name: Extract metadata for search-service
        id: meta-search-service
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.SEARCH_SERVICE_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push search-service image
        uses: docker/build-push-action@v6.7.0
        with:
          context: ./services/search_service
          file: ./services/search_service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-search-service.outputs.tags }}
          labels: ${{ steps.meta-search-service.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    # -----------------------------------------------------------
    # Optional: Summary of built images
    # -----------------------------------------------------------
      - name: Image build summary
        run: |
          echo "## Docker Images Built 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Main Application" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-app.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend (Nginx)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-frontend.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Search Service" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-search-service.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Additional Services (using pre-built images)" >> $GITHUB_STEP_SUMMARY
          echo "- **Cantaloupe IIIF**: \`edirom/cantaloupe\` (no custom build)" >> $GITHUB_STEP_SUMMARY
          echo "- **MinIO S3**: \`minio/minio\` (no custom build)" >> $GITHUB_STEP_SUMMARY
          echo "- **PostgreSQL**: \`postgres:14.13\` (no custom build)" >> $GITHUB_STEP_SUMMARY
          echo "- **OpenSearch**: \`opensearchproject/opensearch:2.17.1\` (no custom build)" >> $GITHUB_STEP_SUMMARY
          echo "- **Redis**: \`redis:7\` (no custom build)" >> $GITHUB_STEP_SUMMARY
          echo "- **RabbitMQ**: \`rabbitmq:3-management\` (no custom build)" >> $GITHUB_STEP_SUMMARY
