# Backend services needed for development.
#
# This file will start all the backend services needed to run InvenioRDM
# locally in development mode.
#
# Usage::
#
#   $ docker compose up -d
#
# Following services are included:
# - Cache: Redis (exposed port: 6379)
# - DB: (PostgresSQL/MySQL) (exposed port: 5432 or 3306)
# - Message queue: RabbitMQ (exposed ports: 5672, 15672)
# - OpenSearch (exposed ports: 9200, 9600)
# - Kibana (view ES indexes) (exposed ports: 5601)
#
services:
  cache:
    extends:
      file: docker-services.yml
      service: cache
  db:
    extends:
      file: docker-services.yml
      service: db
  mq:
    extends:
      file: docker-services.yml
      service: mq
  search:
    extends:
      file: docker-services.yml
      service: search
  opensearch-dashboards:
    extends:
      file: docker-services.yml
      service: opensearch-dashboards
  pgadmin:
    extends:
      file: docker-services.yml
      service: pgadmin
  s3:
    extends:
      file: docker-services.yml
      service: s3
  cantaloupe:
    extends:
      file: docker-services.yml
      service: cantaloupe
    environment:
      # Use HttpSource and map identifiers via BasicLookupStrategy
      - CANTALOUPE_SOURCE_STATIC=HttpSource
      - CANTALOUPE_HTTPSOURCE_LOOKUP_STRATEGY=BasicLookupStrategy
      - CANTALOUPE_HTTPSOURCE_BASICLOOKUPSTRATEGY_URL_PREFIX=https://host.docker.internal:5000/records/
      # Trust local HTTPS (self-signed) during development
      - CANTALOUPE_HTTPSOURCE_ALLOW_INSECURE=true
      # Enable server-side caches
      - CANTALOUPE_CACHE_SERVER_SOURCE=FilesystemCache
      - CANTALOUPE_FILESYSTEMCACHE_PATHNAME=/var/cache/cantaloupe
      - CANTALOUPE_CACHE_SERVER_DERIVATIVE_ENABLED=true
      - CANTALOUPE_CACHE_SERVER_DERIVATIVE=HeapCache
      - CANTALOUPE_HEAPCACHE_PERSIST=false
volumes:
  data: