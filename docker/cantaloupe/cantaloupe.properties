###########################################################################
# Cantaloupe configuration for Turath - MINIMAL (only what works)
###########################################################################

# HTTP server
http.enabled = true
http.host = 0.0.0.0
http.port = 8182

# Endpoints
endpoint.iiif.2.enabled = true
endpoint.admin.enabled = true
endpoint.admin.username = admin
endpoint.admin.secret = dev_secret_change_me
endpoint.health.enabled = true

# Sources - fetch PDFs from local filesystem (mounted volume)
source.static = FilesystemSource
FilesystemSource.BasicLookupStrategy.path_prefix = /opt/cantaloupe/images/
FilesystemSource.BasicLookupStrategy.path_suffix = 
slash_substitute = !

# Processors
processor.pdf = Java2dProcessor
processor.fallback = PdfBoxProcessor

# THE ONLY SETTING THAT MATTERS: Cache processed images
cache.server.derivative.enabled = true
cache.server.derivative = FilesystemCache
cache.server.derivative.ttl_seconds = 2592000
FilesystemCache.pathname = /var/cache/cantaloupe
FilesystemCache.dir.depth = 3
FilesystemCache.dir.name_length = 2

# Client-side caching (helps browsers cache tiles)
cache.client.enabled = true
cache.client.max_age = 2592000
cache.client.public = true

# Logging
log.application.level = debug
log_error_responses = true
print_stack_trace_on_error_pages = true

# Allow upscaling (0 = no maximum; >1.0 would set a limit)
max_scale = 0
