###########################################################################
# Cantaloupe configuration for Turath (HttpSource + caching; local dev)
###########################################################################

# HTTP server
http.enabled = true
http.host = 0.0.0.0
http.port = 8182

# Endpoints
endpoint.iiif.2.enabled = true
endpoint.iiif.3.enabled = true
endpoint.admin.enabled = true
endpoint.admin.username = admin
endpoint.admin.secret = dev_secret_change_me
endpoint.api.enabled = false
endpoint.health.enabled = true

# Sources
source.static = HttpSource
HttpSource.allow_insecure = true
HttpSource.request_timeout = 30
HttpSource.lookup_strategy = BasicLookupStrategy
# Trailing slash is important!
HttpSource.BasicLookupStrategy.url_prefix = 
HttpSource.BasicLookupStrategy.url_suffix = 
HttpSource.BasicLookupStrategy.send_head_requests = false
# Preserve identifiers with slash-substitute since reverse proxy decodes %2F
slash_substitute = !
# Disable random-access chunking to avoid Accept-Ranges requirement in dev
HttpSource.chunking.enabled = false

# Processors
# Explicitly select PDF processor
processor.pdf = PdfBoxProcessor
PdfBoxProcessor.dpi = 150

# Fallback for other formats
processor.fallback = Java2dProcessor

# Retrieval strategy: prefer full download when streaming is not possible/forbidden
processor.stream_retrieval_strategy = DownloadStrategy
processor.fallback_retrieval_strategy = DownloadStrategy

# Server-side caching
# IMPORTANT: Enable source caching to avoid re-downloading PDFs
cache.server.source.enabled = true
cache.server.source = FilesystemCache
cache.server.source.ttl_seconds = 2592000
cache.server.derivative.enabled = true
cache.server.derivative = HeapCache
cache.server.derivative.ttl_seconds = 2592000
cache.server.info.enabled = true
FilesystemCache.pathname = /var/cache/cantaloupe
FilesystemCache.dir.depth = 3
FilesystemCache.dir.name_length = 2
HeapCache.target_size = 512M
HeapCache.persist = false

# Client-side caching headers
cache.client.enabled = true
cache.client.max_age = 2592000
cache.client.public = true

# Logging
log_error_responses = true
print_stack_trace_on_error_pages = true

# Allow upscaling (0 = no maximum; >1.0 would set a limit)
max_scale = 0
