
[metadata]
name = turath-inveniordm

[options.extras_require]
tests =
    pytest-invenio>=2.1.0,<3.0.0

[options.entry_points]
invenio_base.apps =
    turath_inveniordm = turath_inveniordm:init_app
invenio_base.blueprints =
    turath_inveniordm_views = turath_inveniordm.views:create_blueprint
invenio_assets.webpack =
    turath_inveniordm_theme = turath_inveniordm.webpack:theme
invenio_previewer.previewers =
    mirador_previewer = turath_inveniordm.previewer.mirador_previewer
invenio_oauth2server.scopes =
    deposit_write = turath_inveniordm.oauth_scopes:deposit_write_scope
    deposit_actions = turath_inveniordm.oauth_scopes:deposit_actions_scope
