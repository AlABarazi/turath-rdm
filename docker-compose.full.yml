# Example of a full infrastructure stack
#
# Note, this file is not suitable for a production deployment. It is only an
# example of all the infrastructure components needed in a real production
# deployment.
#
# Usage::
#
#   $ docker compose up -f docker-compose.full.yml -d
#
# Following services are included:
# - Frontend: Nginx (exposed ports: 40 and 443)
# - UI application: UWSGI (not exposed)
# - API application: UWSGI (not exposed)
# - Cache: Redis (exposed port: 6379)
# - DB: (PostgresSQL/MySQL) (exposed port: 5432 or 3306)
# - Message queue: RabbitMQ (exposed ports: 5672, 15672)
# - Search platform: (OpenSearch) (exposed ports: 9200, 9600)
# - OpenSearch Dashboard/Kibana (view OS/ES indexes) (exposed ports: 5601)
#
services:
  cache:
    extends:
      file: docker-services.yml
      service: cache
  db:
    extends:
      file: docker-services.yml
      service: db
  mq:
    extends:
      file: docker-services.yml
      service: mq
  search:
    extends:
      file: docker-services.yml
      service: search
  opensearch-dashboards:
    extends:
      file: docker-services.yml
      service: opensearch-dashboards
  pgadmin:
    extends:
      file: docker-services.yml
      service: pgadmin
  s3:
    extends:
      file: docker-services.yml
      service: s3
  cantaloupe:
    extends:
      file: docker-services.yml
      service: cantaloupe
  # IIIF Search & Annotation Service
  search-service:
    build: ./services/search_service
    image: turath-search-service
    restart: "unless-stopped"
    ports:
      - "5001:5001"
    volumes:
      - ./hocr_mount/books:/hocr_mount/books
    environment:
      - HOCR_BASE_DIR=/hocr_mount/books
      - SEARCH_SERVICE_BASE_URL=https://127.0.0.1:5001
      - IIIF_SERVER_BASE_URL=https://127.0.0.1:5000
      - FLASK_ENV=production

  # Frontend
  frontend:
    extends:
      file: docker-services.yml
      service: frontend
    volumes:
      - static_data:/opt/invenio/var/instance/static
      - uploaded_data:/opt/invenio/var/instance/data
      - archived_data:/opt/invenio/var/instance/archive
      - ./hocr_mount/books:/hocr_mount/books
    depends_on:
      - web-ui
      - web-api
    ports:
      - "80:80"
      - "443:443"
    environment:
      - "HOCR_MOUNT_BASE=/hocr_mount/books"

  # UI Application
  web-ui:
    extends:
      file: docker-services.yml
      service: app
    command: ["uwsgi /opt/invenio/var/instance/uwsgi_ui.ini"]
    image: turath-inveniordm:latest
    ports:
      - "5000"
    volumes:
      - static_data:/opt/invenio/var/instance/static
      - uploaded_data:/opt/invenio/var/instance/data
      - archived_data:/opt/invenio/var/instance/archive
      - ./hocr_mount/books:/hocr_mount/books
    environment:
      - "AWS_ACCESS_KEY_ID=minioadmin"
      - "AWS_SECRET_ACCESS_KEY=minioadmin"
      - "AWS_DEFAULT_REGION=us-east-1"
      - "AWS_ENDPOINT_URL=http://s3:9000"
      - "AWS_S3_ADDRESSING_STYLE=path"
      - "AWS_S3_SIGNATURE_VERSION=s3v4"
      - "S3_BUCKET_NAME=turath-files"
      - "HOCR_MOUNT_BASE=/hocr_mount/books"

  # API Rest Application
  web-api:
    extends:
      file: docker-services.yml
      service: app
    command: ["uwsgi /opt/invenio/var/instance/uwsgi_rest.ini"]
    image: turath-inveniordm:latest
    ports:
      - "5000"
    volumes:
      - uploaded_data:/opt/invenio/var/instance/data
      - archived_data:/opt/invenio/var/instance/archive
      - ./hocr_mount/books:/hocr_mount/books
    environment:
      - "HOCR_MOUNT_BASE=/hocr_mount/books"

  # Worker
  worker:
    extends:
      file: docker-services.yml
      service: app
    command: ["celery -A invenio_app.celery worker --beat --loglevel=INFO"]
    image: turath-inveniordm:latest
    volumes:
      - uploaded_data:/opt/invenio/var/instance/data
      - ./hocr_mount/books:/hocr_mount/books
    environment:
      - "HOCR_MOUNT_BASE=/hocr_mount/books"
    depends_on:
      search:
        condition: service_started
      cache:
        condition: service_started
      db:
        condition: service_started
      mq:
        condition: service_started

  # Jobs scheduler
  scheduler:
    extends:
      file: docker-services.yml
      service: app
    command: ["celery -A invenio_app.celery beat --scheduler invenio_jobs.services.scheduler:RunScheduler --loglevel=INFO"]
    image: turath-inveniordm:latest
    depends_on:
      mq:
        condition: service_started
      db:
        condition: service_started
volumes:
  static_data:
  uploaded_data:
  archived_data:
  data:
